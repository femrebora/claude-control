[project]
name = "claude-control"
version = "1.1.0"
description = "Local dashboard for managing ~/.claude/ skills, plugins, agents, and commands"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "starlette<2.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]  # line length is fine; B008 is FastAPI's pattern

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-q --tb=short"
