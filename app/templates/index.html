<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>claude-control</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <!-- Markdown rendering: marked + DOMPurify (no build step) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="brand">
      <span class="dot"></span>
      <h1>claude<span class="slash">/</span>control</h1>
    </div>
    <div class="meta">
      <code>{{ claude_home }}</code>
      <button class="btn ghost" id="theme-toggle" style="font-size:0.65rem;padding:0.2rem 0.5rem;margin-left:1rem;" title="Toggle light/dark theme">light</button>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <nav class="tabs" id="tabs">
    <button data-kind="skills" class="active">Skills</button>
    <button data-kind="plugins">Plugins</button>
    <button data-kind="agents">Agents</button>
    <button data-kind="commands">Commands</button>
  </nav>

  <section class="actions">
    <input type="search" id="filter" placeholder="filter by name, description, or tag…" />
    <div class="action-buttons">
      <select id="sort-select" class="btn ghost" style="padding:0.65rem 0.5rem;" title="Sort order">
        <option value="name-asc">Name A–Z</option>
        <option value="name-desc">Name Z–A</option>
        <option value="modified-desc">Newest first</option>
        <option value="modified-asc">Oldest first</option>
        <option value="size-desc">Largest first</option>
        <option value="size-asc">Smallest first</option>
      </select>
      <button class="btn ghost" id="create-btn">+ new</button>
      <label class="btn ghost">
        <input type="file" id="zip-upload" accept=".zip" hidden />
        upload .zip
      </label>
      <button class="btn ghost" id="clone-btn">git clone…</button>
      <button class="btn ghost" id="bulk-btn">bulk import…</button>
      <button class="btn ghost" id="refresh-btn" title="Re-scan ~/.claude/ (Ctrl+R)">refresh</button>
      <button class="btn ghost" id="trash-btn" title="Manage trashed items">trash</button>
    </div>
  </section>

  <div class="layout">
    <aside class="sidebar">
      <h4>Tags</h4>
      <div id="tag-list"></div>
    </aside>
    <main id="grid" class="grid"></main>
  </div>

  <footer class="footer">
    <span>local only · 127.0.0.1 · no telemetry</span>
  </footer>

  <!-- Preview modal -->
  <div class="modal" id="preview-modal" hidden role="dialog" aria-modal="true" aria-labelledby="preview-title-h">
    <div class="modal-card wide">
      <header class="modal-header">
        <h3 id="preview-title-h">Preview</h3>
        <div style="display: flex; gap: 0.5rem;">
          <button class="btn ghost" id="preview-edit">edit</button>
          <button class="btn ghost" id="preview-close">close</button>
        </div>
      </header>
      <div class="modal-body preview-body">
        <p class="preview-desc" id="preview-desc"></p>
        <div id="preview-tags" class="card-tags"></div>
        <div id="preview-path" class="card-path"></div>
        <article id="preview-content" class="markdown"></article>
        <details class="preview-files" id="preview-files-wrap" hidden>
          <summary>Files in this skill</summary>
          <div id="preview-files"></div>
        </details>
      </div>
    </div>
  </div>

  <!-- Edit modal -->
  <div class="modal" id="edit-modal" hidden role="dialog" aria-modal="true" aria-labelledby="edit-title-h">
    <div class="modal-card">
      <header class="modal-header">
        <h3 id="edit-title-h">Edit</h3>
        <button class="btn ghost" id="edit-close">close</button>
      </header>
      <div class="modal-body">
        <label>Name</label>
        <input id="edit-name" type="text" />
        <label>Description</label>
        <textarea id="edit-desc" rows="3"></textarea>
        <label>Tags <span class="hint">(comma-separated)</span></label>
        <input id="edit-tags" type="text" placeholder="bioinformatics, clinical" />
        <label>Body <span class="hint">(markdown)</span></label>
        <textarea id="edit-body" rows="18"></textarea>
        <div class="modal-actions">
          <button class="btn" id="edit-validate">validate</button>
          <button class="btn primary" id="edit-save">save</button>
        </div>
        <div id="edit-issues"></div>
      </div>
    </div>
  </div>

  <!-- Create new asset modal -->
  <div class="modal" id="create-modal" hidden role="dialog" aria-modal="true" aria-labelledby="create-title-h">
    <div class="modal-card narrow">
      <header class="modal-header">
        <h3 id="create-title-h">Create new asset</h3>
        <button class="btn ghost" id="create-close">close</button>
      </header>
      <div class="modal-body">
        <label>Name <span class="hint">(lowercase, hyphenated, 2-64 chars)</span></label>
        <input id="create-name" type="text" placeholder="my-new-skill" />
        <label>Description</label>
        <textarea id="create-desc" rows="2" placeholder="What does it do?"></textarea>
        <label>Tags <span class="hint">(comma-separated, optional)</span></label>
        <input id="create-tags" type="text" placeholder="utility, claude" />
        <div class="modal-actions">
          <button class="btn primary" id="create-go">create</button>
        </div>
        <div id="create-result"></div>
      </div>
    </div>
  </div>

  <!-- Bulk import modal -->
  <div class="modal" id="bulk-modal" hidden role="dialog" aria-modal="true" aria-labelledby="bulk-title-h">
    <div class="modal-card narrow">
      <header class="modal-header">
        <h3 id="bulk-title-h">Bulk import from repo</h3>
        <button class="btn ghost" id="bulk-close">close</button>
      </header>
      <div class="modal-body">
        <p class="hint">Clones a marketplace repo and imports each top-level folder under <em>subdir</em> as a separate asset.</p>
        <label>Git URL</label>
        <input id="bulk-url" type="text" placeholder="https://github.com/anthropics/skills.git" />
        <label>Subdir <span class="hint">(optional)</span></label>
        <input id="bulk-subdir" type="text" placeholder="skills" />
        <div class="modal-actions">
          <button class="btn primary" id="bulk-go">import</button>
        </div>
        <div id="bulk-result"></div>
      </div>
    </div>
  </div>

  <!-- Trash modal -->
  <div class="modal" id="trash-modal" hidden role="dialog" aria-modal="true" aria-labelledby="trash-title-h">
    <div class="modal-card wide">
      <header class="modal-header">
        <h3 id="trash-title-h">Trash</h3>
        <button class="btn ghost" id="trash-close">close</button>
      </header>
      <div class="modal-body">
        <div id="trash-list"></div>
      </div>
    </div>
  </div>

  <!-- Confirmation modal -->
  <div class="modal" id="confirm-modal" hidden role="alertdialog" aria-modal="true" aria-labelledby="confirm-title-h">
    <div class="modal-card narrow">
      <header class="modal-header">
        <h3 id="confirm-title-h">Confirm</h3>
      </header>
      <div class="modal-body">
        <p id="confirm-message" style="margin:0 0 1rem 0;line-height:1.5;"></p>
        <div class="modal-actions">
          <button class="btn ghost" id="confirm-no">cancel</button>
          <button class="btn danger" id="confirm-yes">yes, delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
